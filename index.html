<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#04050c" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="An offline 3D solar system: orbiting planets and moons on real orbits, adjustable time, trails, labels and info for every world." />
    <meta name="application-name" content="Planet 3D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Planet 3D" />
    <meta name="format-detection" content="telephone=no" />
    <title>Planet 3D</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <style>
      /* Paint the dark background before any CSS or JS arrives (no white flash). */
      html, body { margin: 0; height: 100%; background: #04050c; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="scene" aria-label="3D view of the solar system. Drag to orbit, pinch to zoom, tap a planet to focus."></canvas>
      <div id="labels" aria-label="Body labels"></div>
    </div>

    <div id="hud">
      <div id="top">
        <div id="clock" class="pill" role="status">
          <span id="date">—</span><span id="paused-tag" hidden>Paused</span>
        </div>
        <section id="info" class="card" aria-label="Details" hidden></section>
        <button type="button" id="info-pill" class="pill pill-btn" hidden aria-label="Show details">
          <i class="dot"></i><span></span>
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg>
        </button>
      </div>

      <div id="toast" role="status" aria-live="polite"></div>

      <div id="trail-len" class="vrail left" aria-hidden="false">
        <svg class="cap" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19c5-1 10-5 13-11" /><circle cx="18" cy="6" r="2.2" /></svg>
        <div id="trail-slider" aria-label="Trail length"></div>
        <svg class="cap small" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14c1-1 2-3 3-5" /><circle cx="16.5" cy="7.5" r="2" /></svg>
      </div>

      <div id="zoom" class="vrail right">
        <svg class="cap" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12" /></svg>
        <div id="zoom-slider" aria-label="Zoom"></div>
        <svg class="cap" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" /></svg>
      </div>

      <div id="bottom">
        <nav id="chips" aria-label="Go to a body"></nav>
        <div class="controls">
          <div class="row speed-row">
            <button type="button" id="btn-play" class="tbtn round" aria-label="Pause">
              <svg class="i-pause" viewBox="0 0 24 24"><path d="M8 5.5v13M16 5.5v13" /></svg>
              <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5l11 6.5-11 6.5z" /></svg>
            </button>
            <button type="button" id="btn-reverse" class="tbtn round" aria-label="Run time backwards" aria-pressed="false">
              <svg viewBox="0 0 24 24"><path d="M19 8H6m0 0l3.5-3.5M6 8l3.5 3.5M5 16h13m0 0l-3.5-3.5M18 16l-3.5 3.5" /></svg>
            </button>
            <div id="speed-slider" aria-label="Simulation speed"></div>
            <output id="speed-out" for="speed-slider">—</output>
          </div>
          <div class="row toggles">
            <button type="button" class="tbtn" data-toggle="trails" aria-pressed="true">
              <svg viewBox="0 0 24 24"><path d="M3 19c5-1 10-5 13-11" /><circle cx="18" cy="6" r="2.4" /></svg><span>Trails</span>
            </button>
            <button type="button" class="tbtn" data-toggle="orbits" aria-pressed="true">
              <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9.5" ry="5" /><circle cx="12" cy="12" r="1.8" /></svg><span>Orbits</span>
            </button>
            <button type="button" class="tbtn" data-toggle="labels" aria-pressed="true">
              <svg viewBox="0 0 24 24"><path d="M3.5 12.5L11 5h8.5v8.5L12 21z" /><circle cx="15.5" cy="9" r="1.4" /></svg><span>Labels</span>
            </button>
            <button type="button" class="tbtn" data-toggle="belts" aria-pressed="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2" /><path d="M12 3.5v.01M18 6v.01M20.5 12v.01M18 18v.01M12 20.5v.01M6 18v.01M3.5 12v.01M6 6v.01M15.5 4.3v.01M19.8 9v.01M19.8 15v.01M15.5 19.7v.01M8.5 19.7v.01M4.2 15v.01M4.2 9v.01M8.5 4.3v.01" /></svg><span>Belts</span>
            </button>
            <button type="button" class="tbtn" data-act="scale" aria-pressed="false">
              <svg viewBox="0 0 24 24"><path d="M3 12h18M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3M8 9.5v5M12 8v8M16 9.5v5" /></svg><span>Scale</span>
            </button>
            <button type="button" class="tbtn" data-act="now">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" /><path d="M12 7.5V12l3 2" /></svg><span>Now</span>
            </button>
            <button type="button" class="tbtn" data-act="home">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.6" /><ellipse cx="12" cy="12" rx="9.5" ry="4.2" /><circle cx="20" cy="10.6" r="1.2" /></svg><span>Overview</span>
            </button>
            <button type="button" class="tbtn" data-act="install" hidden>
              <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14" /></svg><span>Install</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="loader" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100">
      <div class="orrery" aria-hidden="true"><i class="sun"></i><i class="o1"><b></b></i><i class="o2"><b></b></i><i class="o3"><b></b></i></div>
      <h1>Planet 3D</h1>
      <p id="loader-msg">Forming planets…</p>
      <div class="bar"><div></div></div>
    </div>

    <noscript><p class="noscript">Planet 3D needs JavaScript and WebGL.</p></noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
